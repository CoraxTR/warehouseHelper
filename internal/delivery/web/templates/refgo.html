<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>РефГо</title>
    <link rel="stylesheet" href="/static/raven-guard.css">
</head>

<body class="menu">
    <header class="brandbar">
        <a class="brandbar__brand" href="/"><svg class="brandbar__emblem" viewBox="0 0 64 64" aria-hidden="true"><circle cx="35" cy="25" r="14" fill="#F4F1E9"/><polygon points="6,26 30,17 28,27" fill="#F4F1E9"/><polygon points="13,35 28,27 26,36" fill="#F4F1E9"/><circle cx="34" cy="23" r="3.6" fill="#0A0A0D"/><circle cx="33" cy="22" r="1.1" fill="#C02832"/></svg><span class="brandbar__name">ВОРОН&nbsp;&middot;&nbsp;СКЛАД</span></a>
        <span class="brandbar__motto">Victorus aut Mortis</span>
    </header>
    <h1>РефГо</h1>
    <div class="actions">
        <form action="/sync" method="post" id="sync-form">
            <button type="submit">Выгрузка заказов</button>
        </form>
        <a class="button" href="/refgo-check">Сверка</a>
        <a class="button" href="/order-find">Найти заказ</a>
    </div>

    <!-- Оверлей, показывается во время загрузки -->
    <div id="loading-overlay">
        <img src="/static/loading.gif" alt="Загрузка...">
        <p>Очень заняты, вертим РефГо на хую</p>
    </div>

    <script>
        const form = document.getElementById('sync-form');
        const overlay = document.getElementById('loading-overlay');

        form.addEventListener('submit', function () {
            overlay.style.display = 'flex'; // показываем оверлей
        });
    </script>
</body>

</html>
