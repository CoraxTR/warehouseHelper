<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Получить коды</title>
    <link rel="stylesheet" href="/static/raven-guard.css">
</head>

<body>
    <header class="brandbar">
        <a class="brandbar__brand" href="/"><svg class="brandbar__emblem" viewBox="0 0 64 64" aria-hidden="true"><circle cx="35" cy="25" r="14" fill="#F4F1E9"/><polygon points="6,26 30,17 28,27" fill="#F4F1E9"/><polygon points="13,35 28,27 26,36" fill="#F4F1E9"/><circle cx="34" cy="23" r="3.6" fill="#0A0A0D"/><circle cx="33" cy="22" r="1.1" fill="#C02832"/></svg><span class="brandbar__name">ВОРОН&nbsp;&middot;&nbsp;СКЛАД</span></a>
        <span class="brandbar__motto">Приёмка или смерть</span>
    </header>
    <h1>Получить коды</h1>

    {{if .Orders}}
    <table>
        <thead>
            <tr>
                <th>Номер заказа</th>
                <th>Фотографии</th>
            </tr>
        </thead>
        <tbody>
            {{range $order := .Orders}}
            <tr>
                <td>{{$order.OrderNumber}}</td>
                <td>
                    <div class="thumbs">
                        {{range $order.Photos}}
                        <img src="/qrcodes/photos/{{.ID}}.{{.Ext}}" alt="Фото заказа {{$order.OrderNumber}}">
                        {{end}}
                    </div>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
    {{else}}
    <p class="empty">Заказов с фотографиями пока нет.</p>
    {{end}}

    <a class="back" href="/qrcodes">← Назад</a>

    <div id="lightbox">
        <img id="lightbox-img" src="" alt="Фото">
    </div>

    <script>
        // Лайтбокс полноразмерного просмотра. Фото заказа листают:
        // на ПК — клавиши ←/→, на телефоне — свайп влево/вправо.
        // Экранных кнопок нет. Листание не выходит за границы текущего заказа:
        // все его фото лежат в одном контейнере .thumbs, из них и собирается список.
        // Код в ES5: страницу открывают и со старых браузеров склада
        // (без const/стрелочных функций/NodeList.forEach).
        (function () {
            var lightbox = document.getElementById('lightbox');
            var lightboxImg = document.getElementById('lightbox-img');
            var photos = [];      // фото текущего заказа (их src показывает лайтбокс)
            var photoIndex = 0;
            var lastSwipeAt = 0;  // время последнего свайпа (для гашения лишнего клика)
            var touchX = null;    // начало касания для свайпа
            var touchY = null;

            function openLightbox(orderPhotos, index) {
                photos = orderPhotos;
                photoIndex = index;
                lightboxImg.src = orderPhotos[index].src;
                lightbox.style.display = 'flex';
            }

            function closeLightbox() {
                lightbox.style.display = 'none';
            }

            // Листание по кругу в границах текущего заказа.
            function flip(step) {
                if (photos.length < 2) {
                    return;
                }
                photoIndex = (photoIndex + step + photos.length) % photos.length;
                lightboxImg.src = photos[photoIndex].src;
            }

            lightbox.addEventListener('touchstart', function (e) {
                if (e.touches.length !== 1) {
                    touchX = null; // несколько пальцев (зум) — свайпы не считаем
                    return;
                }
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            });

            lightbox.addEventListener('touchmove', function (e) {
                if (touchX === null || e.touches.length !== 1) {
                    return;
                }
                var dx = e.touches[0].clientX - touchX;
                var dy = e.touches[0].clientY - touchY;
                // Горизонтальный жест не должен скроллить страницу под лайтбоксом.
                if (Math.abs(dx) > Math.abs(dy)) {
                    e.preventDefault();
                }
            }, { passive: false });

            lightbox.addEventListener('touchend', function (e) {
                if (touchX === null) {
                    return;
                }
                var t = e.changedTouches[0];
                var dx = t.clientX - touchX;
                var dy = t.clientY - touchY;
                touchX = null;
                touchY = null;
                // Свайп: ход от 40px и по горизонтали. Влево — следующее фото,
                // вправо — предыдущее. Короткое касание — не листание (клик закроет).
                if (Math.abs(dx) < 40 || Math.abs(dx) <= Math.abs(dy)) {
                    return;
                }
                lastSwipeAt = Date.now();
                flip(dx < 0 ? 1 : -1);
            });

            // Клик закрывает просмотр. Браузер сам присылает «клик» сразу после
            // свайпа — такой клик пропускаем, иначе свайп закроет фото.
            lightbox.addEventListener('click', function () {
                if (Date.now() - lastSwipeAt < 500) {
                    return;
                }
                closeLightbox();
            });

            var thumbs = document.querySelectorAll('.thumbs img');
            for (var t = 0; t < thumbs.length; t++) {
                thumbs[t].addEventListener('click', function () {
                    // Соседние фото по контейнеру .thumbs — то есть того же заказа.
                    var groupImgs = this.parentNode.getElementsByTagName('img');
                    var orderPhotos = [];
                    for (var g = 0; g < groupImgs.length; g++) {
                        orderPhotos.push(groupImgs[g]);
                    }
                    for (var i = 0; i < orderPhotos.length; i++) {
                        if (orderPhotos[i] === this) {
                            openLightbox(orderPhotos, i);
                            return;
                        }
                    }
                });
            }

            document.addEventListener('keydown', function (e) {
                if (lightbox.style.display !== 'flex') {
                    return; // просмотр закрыт — клавиши работают как обычно
                }
                if (e.keyCode === 37) { // ←
                    e.preventDefault();
                    flip(-1);
                } else if (e.keyCode === 39) { // →
                    e.preventDefault();
                    flip(1);
                }
            });
        })();
    </script>
</body>

</html>
