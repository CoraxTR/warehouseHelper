<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Добавить коды</title>
    <link rel="stylesheet" href="/static/raven-guard.css">
</head>

<body>
    <header class="brandbar">
        <a class="brandbar__brand" href="/"><svg class="brandbar__emblem" viewBox="0 0 64 64" aria-hidden="true"><circle cx="35" cy="25" r="14" fill="#F4F1E9"/><polygon points="6,26 30,17 28,27" fill="#F4F1E9"/><polygon points="13,35 28,27 26,36" fill="#F4F1E9"/><circle cx="34" cy="23" r="3.6" fill="#0A0A0D"/><circle cx="33" cy="22" r="1.1" fill="#C02832"/></svg><span class="brandbar__name">ВОРОН&nbsp;&middot;&nbsp;СКЛАД</span></a>
        <span class="brandbar__motto">Приёмка или смерть</span>
    </header>
    <h1>Добавить коды</h1>

    {{if .Msg}}<div class="msg">{{.Msg}}</div>{{end}}
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}

    <form method="post" action="/qrcodes/add" enctype="multipart/form-data">
        <label for="order_number">Введите номер заказа</label>
        <input type="text" id="order_number" name="order_number" value="{{.OrderNumber}}"
            placeholder="Например, 12345" autofocus required inputmode="numeric">

        <label for="photos">Фотографии кодов</label>
        <input type="file" id="photos" name="photos" accept="image/*" multiple capture="environment">
        <div id="preview"></div>
        <div id="photo-count" class="photo-count"></div>
        <button type="button" id="clear-photos" class="btn-secondary" style="display:none">Очистить фото</button>

        <button type="submit" class="btn">Сохранить</button>
    </form>

    <a class="back" href="/qrcodes">← Назад</a>

    <script>
        // Несколько фото за раз: на iOS capture-камера отдаёт один снимок за
        // вызов, поэтому все выбранные/снятые файлы накапливаются в списке
        // (DataTransfer), а не заменяют друг друга. На Android срабатывает
        // и серийная съёмка (multiple + capture), она тоже складывается сюда.
        // Ограничения на количество фото нет — сколько сняли, столько и уйдёт.
        //
        // Превью — миниатюры в canvas: файлы декодируются строго по одному,
        // и большой растр (3000×4000×4 ≈ 48 МБ) живёт только на время одного
        // декода. Полные <img src=objectURL> висели бы в DOM все разом — на
        // 5–6 фото браузер убивал вкладку по лимиту памяти.
        const input = document.getElementById('photos');
        const preview = document.getElementById('preview');
        const count = document.getElementById('photo-count');
        const clearBtn = document.getElementById('clear-photos');
        const dt = new DataTransfer();

        // Номер поколения превью: «Очистить фото» инвалидирует очередь — уже
        // декодирующиеся файлы не добавят canvas в очищенный список.
        let previewVersion = 0;

        // Очередь декодирования: следующий файл обрабатывается после
        // завершения предыдущего (promise-цепочка), поэтому пик памяти не
        // зависит от числа выбранных фото.
        let thumbQueue = Promise.resolve();

        function addThumb(file) {
            const version = previewVersion;
            thumbQueue = thumbQueue
                .then(() => makeThumb(file))
                .then(canvas => {
                    if (canvas && version === previewVersion) preview.appendChild(canvas);
                })
                .catch(() => {}); // битый файл не роняет очередь — сервер разберётся
        }

        // Декодирует файл во временный Image, рисует миниатюру (длинная
        // сторона ≤ 480px) в canvas и сразу освобождает растр оригинала.
        // EXIF-поворот применяет сам браузер; objectURL живёт только на
        // время декода — после отрисовки revoke.
        async function makeThumb(file) {
            const url = URL.createObjectURL(file);
            try {
                const img = new Image();
                img.decoding = 'async';
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = () => reject(new Error('не удалось декодировать'));
                    img.src = url;
                });
                const long = Math.max(img.width, img.height);
                const k = Math.min(1, 480 / long);
                const canvas = document.createElement('canvas');
                canvas.width = Math.max(1, Math.round(img.width * k));
                canvas.height = Math.max(1, Math.round(img.height * k));
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                return canvas;
            } finally {
                URL.revokeObjectURL(url);
            }
        }

        function updateCount() {
            count.textContent = dt.files.length > 0 ? 'Добавлено фото: ' + dt.files.length : '';
            clearBtn.style.display = dt.files.length > 0 ? 'inline-block' : 'none';
        }

        input.addEventListener('change', () => {
            for (const file of input.files) {
                dt.items.add(file);
                addThumb(file);
            }
            input.value = ''; // сброс, чтобы можно было снять ещё раз те же сцены
            input.files = dt.files; // в форму уйдут все накопленные файлы
            updateCount();
        });

        clearBtn.addEventListener('click', () => {
            while (dt.items.length) dt.items.remove(0);
            input.files = dt.files;
            preview.innerHTML = '';
            previewVersion++;
            updateCount();
        });
    </script>
</body>

</html>
