<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Добавить коды</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background: #f5f5f5;
        }

        h1 {
            font-size: 22px;
        }

        label {
            display: block;
            margin: 16px 0 6px;
            font-size: 16px;
            font-weight: bold;
        }

        input[type=text] {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            font-size: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        input[type=file] {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            font-size: 16px;
            background: white;
            border: 1px dashed #999;
            border-radius: 6px;
        }

        .btn {
            width: 100%;
            margin-top: 20px;
            padding: 18px;
            font-size: 20px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
        }

        .btn:hover {
            background-color: #218838;
        }

        .msg {
            margin: 12px 0;
            padding: 10px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 6px;
            color: #155724;
        }

        .err {
            margin: 12px 0;
            padding: 10px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            color: #721c24;
        }

        #preview {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        #preview img {
            width: 30%;
            border-radius: 4px;
        }

        .back {
            display: inline-block;
            margin-top: 16px;
            color: #555;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <h1>Добавить коды</h1>

    {{if .Msg}}<div class="msg">{{.Msg}}</div>{{end}}
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}

    <form method="post" action="/qrcodes/add" enctype="multipart/form-data">
        <label for="order_number">Введите номер заказа</label>
        <input type="text" id="order_number" name="order_number" value="{{.OrderNumber}}"
            placeholder="Например, 12345" autofocus required>

        <label for="photos">Фотографии кодов</label>
        <input type="file" id="photos" name="photos" accept="image/*" multiple capture="environment">
        <div id="preview"></div>

        <button type="submit" class="btn">Сохранить</button>
    </form>

    <a class="back" href="/qrcodes">← Назад</a>

    <script>
        const input = document.getElementById('photos');
        const preview = document.getElementById('preview');

        input.addEventListener('change', () => {
            preview.innerHTML = '';
            for (const file of input.files) {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                preview.appendChild(img);
            }
        });
    </script>
</body>

</html>
