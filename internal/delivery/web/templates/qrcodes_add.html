<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Добавить коды</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background: #f5f5f5;
        }

        h1 {
            font-size: 22px;
        }

        label {
            display: block;
            margin: 16px 0 6px;
            font-size: 16px;
            font-weight: bold;
        }

        input[type=text] {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            font-size: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        input[type=file] {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            font-size: 16px;
            background: white;
            border: 1px dashed #999;
            border-radius: 6px;
        }

        .btn {
            width: 100%;
            margin-top: 20px;
            padding: 18px;
            font-size: 20px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
        }

        .btn:hover {
            background-color: #218838;
        }

        .msg {
            margin: 12px 0;
            padding: 10px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 6px;
            color: #155724;
        }

        .err {
            margin: 12px 0;
            padding: 10px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            color: #721c24;
        }

        #preview {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        #preview img {
            width: 30%;
            border-radius: 4px;
        }

        .photo-count {
            margin: 10px 0 4px;
            font-size: 15px;
            color: #555;
        }

        .btn-secondary {
            margin-top: 6px;
            padding: 10px 16px;
            font-size: 15px;
            cursor: pointer;
            background: #fff;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .back {
            display: inline-block;
            margin-top: 16px;
            color: #555;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <h1>Добавить коды</h1>

    {{if .Msg}}<div class="msg">{{.Msg}}</div>{{end}}
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}

    <form method="post" action="/qrcodes/add" enctype="multipart/form-data">
        <label for="order_number">Введите номер заказа</label>
        <input type="text" id="order_number" name="order_number" value="{{.OrderNumber}}"
            placeholder="Например, 12345" autofocus required>

        <label for="photos">Фотографии кодов</label>
        <input type="file" id="photos" name="photos" accept="image/*" multiple capture="environment">
        <div id="preview"></div>
        <div id="photo-count" class="photo-count"></div>
        <button type="button" id="clear-photos" class="btn-secondary" style="display:none">Очистить фото</button>

        <button type="submit" class="btn">Сохранить</button>
    </form>

    <a class="back" href="/qrcodes">← Назад</a>

    <script>
        // Несколько фото за раз: на iOS capture-камера отдаёт один снимок за
        // вызов, поэтому все выбранные/снятые файлы накапливаются в списке
        // (DataTransfer), а не заменяют друг друга. На Android срабатывает
        // и серийная съёмка (multiple + capture), она тоже складывается сюда.
        // Ограничения на количество фото нет — сколько сняли, столько и уйдёт.
        const input = document.getElementById('photos');
        const preview = document.getElementById('preview');
        const count = document.getElementById('photo-count');
        const clearBtn = document.getElementById('clear-photos');
        const dt = new DataTransfer();
        const objectUrls = [];

        function renderPreview() {
            for (const url of objectUrls) URL.revokeObjectURL(url);
            objectUrls.length = 0;
            preview.innerHTML = '';
            for (const file of dt.files) {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                objectUrls.push(img.src);
                preview.appendChild(img);
            }
            count.textContent = dt.files.length > 0 ? 'Добавлено фото: ' + dt.files.length : '';
            clearBtn.style.display = dt.files.length > 0 ? 'inline-block' : 'none';
        }

        input.addEventListener('change', () => {
            for (const file of input.files) {
                dt.items.add(file);
            }
            input.value = ''; // сброс, чтобы можно было снять ещё раз те же сцены
            input.files = dt.files; // в форму уйдут все накопленные файлы
            renderPreview();
        });

        clearBtn.addEventListener('click', () => {
            while (dt.items.length) dt.items.remove(0);
            input.files = dt.files;
            renderPreview();
        });
    </script>
</body>

</html>
