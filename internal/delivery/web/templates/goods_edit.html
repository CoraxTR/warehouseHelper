<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Позиция: {{.Product.Name}}</title>
    <link rel="stylesheet" href="/static/raven-guard.css">
    <script src="/static/theme.js"></script>
</head>

<body>
    <header class="brandbar">
        <a class="brandbar__brand" href="/"><svg class="brandbar__emblem" viewBox="0 0 64 64" aria-hidden="true"><circle class="em__shade" cx="35" cy="25" r="14"/><polygon class="em__shade" points="6,26 30,17 28,27"/><polygon class="em__shade" points="13,35 28,27 26,36"/><circle class="em__eye" cx="34" cy="23" r="3.6"/><circle class="em__glint" cx="33" cy="22" r="1.1"/></svg><span class="brandbar__name">ВОРОН&nbsp;&middot;&nbsp;СКЛАД</span></a>
        <div class="brandbar__right">
            <span class="brandbar__motto">Приёмка или смерть</span>
            <span class="themeswitch" id="theme-switch">
                <span class="themeswitch__label" id="theme-label"><span class="themeswitch__label-night">Нормальная тема</span><span class="themeswitch__label-day">Любитель щурится</span></span>
                <button class="themeswitch__track" id="theme-toggle" type="button"
                 role="switch" aria-checked="false" aria-label="Тема оформления"
                 title="Переключить на «Любитель щурится»">
                    <span class="themeswitch__knob"></span>
                </button>
            </span>
        </div>
    </header>
    {{template "nav"}}
    <div class="topbar">
        <h1>{{.Product.Name}}</h1>
        <form method="post" action="/goods/resync?id={{.Product.ID}}" style="margin:0;">
            <button type="submit" class="resync-btn">Обновить до МС</button>
        </form>
    </div>
    <p><a href="/goods">← Назад в Продукцию</a></p>

    {{if .OK}}
    <div class="banner ok">{{.OK}}</div>
    {{end}}
    {{if .Error}}
    <div class="banner err">{{.Error}}</div>
    {{end}}

    <form class="fields" method="post" action="/goods/edit">
        <input type="hidden" name="id" value="{{.Product.ID}}">

        <div class="field">
            <label>id (МойСклад)</label>
            <input type="text" value="{{.Product.ID}}" readonly>
        </div>
        <div class="field">
            <label>Внутренний код</label>
            <input type="text" name="internal_code" value="{{.Product.InternalCode}}">
        </div>
        <div class="field">
            <label>Название</label>
            <input type="text" name="name" value="{{.Product.Name}}">
        </div>
        <div class="field">
            <label>Единица измерения</label>
            <input type="text" name="uom" value="{{.Product.UOM}}">
        </div>
        <div class="field">
            <label>Группа</label>
            <input type="text" name="group_name" value="{{.Product.GroupName}}">
        </div>
        <div class="field">
            <label>Средний вес, кг</label>
            <input type="number" step="0.0001" name="average_weight"
                {{if .Product.AverageWeight}}value="{{printf "%.4f" .Product.AverageWeight}}"{{end}}>
        </div>
        <div class="field">
            <label>Общий срок годности, дни</label>
            <input type="number" step="1" name="shelf_life"
                {{if .Product.ShelfLife}}value="{{.Product.ShelfLife}}"{{end}}>
        </div>
        <div class="field">
            <label>Кол-во в упаковке</label>
            <input type="number" step="1" name="pack_size"
                {{if .Product.PackSize}}value="{{.Product.PackSize}}"{{end}}>
        </div>
        <div class="field">
            <label>Вид инвентаризации</label>
            <input type="text" name="inventory_type" value="{{.Product.InventoryType}}">
        </div>
        <div class="field">
            <label>URL на сайте</label>
            <input type="text" name="site_url" value="{{.Product.SiteURL}}"
                placeholder="https://www.steakhome.ru/catalog/element/...">
            {{if .Product.SiteURL}}<a href="{{.Product.SiteURL}}" target="_blank" rel="noopener">открыть</a>{{end}}
        </div>
        <div class="field">
            <label><input type="checkbox" name="short_list" {{if .Product.ShortList}}checked{{end}}> Шорт лист</label>
        </div>
        <div class="field">
            <label><input type="checkbox" name="track_weekly" {{if .Product.TrackWeekly}}checked{{end}}> Недельный</label>
        </div>

        <button type="submit" class="save-btn">Сохранить</button>
    </form>
</body>

</html>
