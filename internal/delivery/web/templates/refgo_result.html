<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Результаты сверки</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 6px;
        }

        .ok {
            color: #155724;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            padding: 8px 12px;
            display: inline-block;
        }

        a {
            color: #007bff;
        }
    </style>
</head>

<body>
    <h1>Результаты сверки</h1>
    <p>За заявленный период было сделано {{.RetrievesCount}} заборов?</p>
    <h2>Проверить на ошибки:</h2>
    {{if .Errors}}
    <ul>
        {{range .Errors}}
        <li>{{.}}</li>
        {{end}}
    </ul>
    {{else}}
    <p class="ok">Ошибок не обнаружено</p>
    {{end}}
    <p><a href="/orders">Назад к заказам</a></p>
</body>

</html>
