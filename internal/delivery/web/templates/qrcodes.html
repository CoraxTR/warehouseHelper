<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Честный знак</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 16px;
            background: #f5f5f5;
        }

        h1 {
            font-size: 24px;
        }

        .btn {
            display: block;
            width: 100%;
            max-width: 360px;
            margin: 16px auto;
            padding: 18px;
            font-size: 20px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .back {
            display: inline-block;
            margin-top: 24px;
            color: #555;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <h1>Честный знак</h1>
    <a class="btn" href="/qrcodes/add">Добавить коды</a>
    <a class="btn" href="/qrcodes/list">Получить коды</a>
    <a class="back" href="/">← На главную</a>
</body>

</html>
