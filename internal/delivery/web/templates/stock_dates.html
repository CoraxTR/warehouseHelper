<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{{if .ShortList}}Шорт-лист — Сроки{{else}}Сроки{{end}}</title>
    <link rel="stylesheet" href="/static/raven-guard.css">
    <script src="/static/theme.js"></script>
</head>

<body data-short="{{if .ShortList}}1{{else}}0{{end}}">
    <header class="brandbar">
        <a class="brandbar__brand" href="/"><svg class="brandbar__emblem" viewBox="0 0 64 64" aria-hidden="true"><circle class="em__shade" cx="35" cy="25" r="14"/><polygon class="em__shade" points="6,26 30,17 28,27"/><polygon class="em__shade" points="13,35 28,27 26,36"/><circle class="em__eye" cx="34" cy="23" r="3.6"/><circle class="em__glint" cx="33" cy="22" r="1.1"/></svg><span class="brandbar__name">ВОРОН&nbsp;&middot;&nbsp;СКЛАД</span></a>
        <div class="brandbar__right">
            <span class="brandbar__motto">Приёмка или смерть</span>
            <span class="themeswitch" id="theme-switch">
                <span class="themeswitch__label" id="theme-label"><span class="themeswitch__label-night">Нормальная тема</span><span class="themeswitch__label-day">Любитель щурится</span></span>
                <button class="themeswitch__track" id="theme-toggle" type="button"
                 role="switch" aria-checked="false" aria-label="Тема оформления"
                 title="Переключить на «Любитель щурится»">
                    <span class="themeswitch__knob"></span>
                </button>
            </span>
        </div>
    </header>
    {{template "nav"}}

    <div class="topbar">
        <h1>{{if .ShortList}}Шорт-лист{{else}}Сроки{{end}}</h1>
        <div class="top-actions">
            {{if .ShortList}}<a class="btn" href="/ms/dates">← Сроки</a>{{else}}<a class="btn" href="/ms/dates/short">Шорт-лист</a>{{end}}
            <a class="btn" href="/ms/discounts">Скидки</a>
            <a class="btn btn-green" href="/ms/dates/update">Обновить сроки</a>
            <span id="ws-status">подключение…</span>
        </div>
    </div>

    {{if not .ShortList}}
    <div class="dates-search">
        <input type="text" id="dates-search" placeholder="Поиск позиции по названию" autocomplete="off" spellcheck="false">
        <div id="dates-hits" class="hits hidden"></div>
    </div>
    {{end}}

    <table id="stock-table">
        <thead>
            <tr id="head-row"></tr>
        </thead>
        <tbody id="stock-body"></tbody>
    </table>

    <div id="modal-overlay" class="overlay hidden">
        <div class="modal">
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        // Модуль «Сроки»: таблица остатков по срокам годности, обновление по вебсокету.
        // Только ES5 (старые браузеры склада): без :scope, NodeList.forEach, стрелок и шаблонных строк.

        // Любая ошибка скрипта — в статус соединения: при пустой таблице сразу
        // видно, что сломалось (рендер, клик, ws-обработчик), без консоли.
        window.onerror = function (msg) {
            var el = document.getElementById('ws-status');
            if (el) {
                el.textContent = 'JS-ошибка: ' + msg;
            }
        };

        var STOCK = {
            products: [],   // упорядоченный список (group_name, name, best_before — от сервера)
            index: {},      // product_id -> индекс в products
            shortList: false,
            defaultCollapsed: true, // «Сроки» — группы свёрнуты; шорт-лист — раскрыты
            collapsed: {},  // явно переключённые группы: group_name -> true/false
            ws: null,
            reconnTimer: null,
            renderTimer: null
        };

        var MODAL = { productID: null, bb: null };
        var UPDATE_CTX = null; // контекст кнопки «Обновить сроки …» в модалке

        function initStock() {
            STOCK.shortList = (document.body.getAttribute('data-short') === '1');
            STOCK.defaultCollapsed = !STOCK.shortList;
            document.getElementById('stock-body').addEventListener('click', onBodyClick);
            initSearch(); // на шорт-листе поля поиска нет — функция молча выходит
            var overlay = document.getElementById('modal-overlay');
            overlay.addEventListener('click', function (ev) {
                if (ev.target === overlay) {
                    closeModal();
                }
            });
            // Кнопка «Обновить сроки …» в модалке (делегирование, без inline-обработчиков с данными).
            var mc = document.getElementById('modal-content');
            mc.addEventListener('click', function (ev) {
                var t = ev.target || ev.srcElement;
                while (t && t !== mc) {
                    if (t.getAttribute && t.getAttribute('data-update') === '1') {
                        goUpdate();
                        return;
                    }
                    t = t.parentNode;
                }
            });
            // pageshow с persisted — страница восстановлена из bfcache (вернулись
            // со страницы сканирования или из другой вкладки): соединение и данные
            // могли отстать. visibilitychange — ПК вышел из сна/вернулись на вкладку,
            // а сокет уже закрыт: не ждём 3 секунды таймера, синхронизируемся сразу.
            window.addEventListener('pageshow', function (ev) {
                if (ev.persisted) {
                    resync();
                }
            });
            document.addEventListener('visibilitychange', function () {
                if (!document.hidden && (!STOCK.ws || STOCK.ws.readyState !== 1)) {
                    resync();
                }
            });
            connect();
            // Список активных пар окна — сразу и дальше раз в минуту: он решает,
            // какой скидке показываться в правой колонке, а какой только в
            // карточке количества.
            loadActiveLots();
            setInterval(loadActiveLots, 60000);
        }

        // --- вебсокет ---

        function connect() {
            var proto = (window.location.protocol === 'https:') ? 'wss://' : 'ws://';
            STOCK.ws = new WebSocket(proto + window.location.host + '/ms/dates/ws');
            STOCK.ws.onopen = function () {
                setStatus('онлайн', 'online');
            };
            STOCK.ws.onmessage = function (ev) {
                var msg;
                try {
                    msg = JSON.parse(ev.data);
                } catch (e) {
                    return;
                }
                onMessage(msg);
            };
            STOCK.ws.onclose = function () {
                setStatus('переподключение…', 'offline');
                scheduleReconnect();
            };
            STOCK.ws.onerror = function () {
                try {
                    STOCK.ws.close();
                } catch (e) { /* noop */ }
            };
        }

        function scheduleReconnect() {
            if (STOCK.reconnTimer) {
                return;
            }
            STOCK.reconnTimer = setTimeout(function () {
                STOCK.reconnTimer = null;
                connect();
            }, 3000);
        }

        // Пересинхронизация: возврат на страницу из истории (в т.ч. bfcache) или
        // из сна ПК — соединение могло умереть, а дельты потеряться, и страница
        // осталась бы в устаревшем состоянии до F5. Сервер на КАЖДОЕ подключение
        // отдаёт полный снапшот, поэтому переподключение = «догнать реальность».
        function resync() {
            if (STOCK.reconnTimer) {
                clearTimeout(STOCK.reconnTimer);
                STOCK.reconnTimer = null;
            }
            if (STOCK.ws) {
                STOCK.ws.onclose = null; // старый сокет не должен звать переподключение
                try {
                    STOCK.ws.close();
                } catch (e) { /* noop */ }
            }
            connect();
        }

        function setStatus(text, cls) {
            var el = document.getElementById('ws-status');
            el.textContent = text;
            el.className = cls || '';
        }

        function onMessage(msg) {
            if (msg.type === 'snapshot') {
                applySnapshot(msg.rows || []);
            } else if (msg.type === 'lot_upsert') {
                applyLotUpsert(msg);
            } else if (msg.type === 'lot_delete') {
                applyLotDelete(msg);
            } else if (msg.type === 'product_delete') {
                applyProductDelete(msg);
            }
            scheduleRender();
        }

        function applySnapshot(rows) {
            STOCK.products = rows;
            // lots обязан быть массивом: старые версии сервера могли прислать
            // null (товар без остатков), рендер читает p.lots.length.
            for (var i = 0; i < STOCK.products.length; i++) {
                if (!STOCK.products[i].lots) {
                    STOCK.products[i].lots = [];
                }
            }
            reindex();
        }

        // Дата лота для СРАВНЕНИЙ — только YYYY-MM-DD (первые 10 символов):
        // сервер шлёт даты в разных формах (RFC3339 в снапшоте и lot_upsert,
        // DateOnly в старом lot_delete), сравнивать их строками «как есть»
        // нельзя — удаление молча промахивалось и старые лоты оставались.
        function lotDate(v) {
            return String(v).slice(0, 10);
        }

        // Дельта для известного товара; неизвестный игнорируем —
        // снапшот всегда приходит первым, новых товаров эта версия не добавляет.
        function applyLotUpsert(msg) {
            var p = findProduct(msg.product_id);
            if (!p || !msg.lot) {
                return;
            }
            var lot = msg.lot;
            var bb = lotDate(lot.best_before);
            for (var i = 0; i < p.lots.length; i++) {
                if (lotDate(p.lots[i].best_before) === bb) {
                    p.lots[i] = lot;
                    return;
                }
            }
            p.lots.push(lot);
            p.lots.sort(function (a, b) {
                return a.best_before < b.best_before ? -1 : (a.best_before > b.best_before ? 1 : 0);
            });
        }

        function applyLotDelete(msg) {
            var p = findProduct(msg.product_id);
            if (!p) {
                return;
            }
            var bb = lotDate(msg.best_before);
            for (var i = 0; i < p.lots.length; i++) {
                if (lotDate(p.lots[i].best_before) === bb) {
                    p.lots.splice(i, 1);
                    return;
                }
            }
        }

        function applyProductDelete(msg) {
            var i = STOCK.index[msg.product_id];
            if (i === undefined) {
                return;
            }
            STOCK.products.splice(i, 1);
            reindex();
        }

        function reindex() {
            STOCK.index = {};
            for (var i = 0; i < STOCK.products.length; i++) {
                STOCK.index[STOCK.products[i].id] = i;
            }
        }

        function findProduct(id) {
            var i = STOCK.index[id];
            return (i === undefined) ? null : STOCK.products[i];
        }

        // --- рендер ---

        function scheduleRender() {
            if (STOCK.renderTimer) {
                return;
            }
            STOCK.renderTimer = setTimeout(function () {
                STOCK.renderTimer = null;
                render();
            }, 80);
        }

        // Пары показываем только для лотов с остатком (qty > 0).
        function visibleLots(p) {
            var out = [];
            for (var i = 0; i < p.lots.length; i++) {
                if (p.lots[i].qty > 0) {
                    out.push(p.lots[i]);
                }
            }
            return out;
        }

        function render() {
            var i, k;
            var items = [];
            for (i = 0; i < STOCK.products.length; i++) {
                var p = STOCK.products[i];
                if (STOCK.shortList && !p.short_list) {
                    continue;
                }
                items.push(p);
            }

            // Ширина таблицы: максимум видимых пар по строкам РАСКРЫТЫХ групп.
            var n = 0;
            for (i = 0; i < items.length; i++) {
                if (isGroupCollapsed(items[i].group_name || '')) {
                    continue;
                }
                var cnt = visibleLots(items[i]).length;
                if (cnt > n) {
                    n = cnt;
                }
            }

            var head = '<tr><th class="col-toggle"></th><th class="col-name">Наименование</th>';
            for (k = 0; k < n; k++) {
                head += '<th>Кол-во</th><th>Срок</th>';
            }
            head += '<th>Скидка сайт</th><th>Скидка ТГ</th></tr>';
            document.getElementById('head-row').innerHTML = head;

            var html = '';
            var lastGroup = null;
            var colspan = 2 * n + 3;
            for (i = 0; i < items.length; i++) {
                var g = items[i].group_name || '';
                if (g !== lastGroup) {
                    lastGroup = g;
                    html += groupRow(g, isGroupCollapsed(g), colspan);
                }
                if (!isGroupCollapsed(g)) {
                    html += productRow(items[i], n);
                }
            }
            document.getElementById('stock-body').innerHTML = html;
            renderDataCount();
            applyPendingFocus(); // строка, найденная поиском: фокус
            blinkReapply();     // мигание продолжается после пересборки tbody
        }

        // Диагностика в статусе соединения: после рендера показывает, сколько
        // позиций пришло в снапшоте («онлайн · 25 поз.»). Пусто/нет вызова =
        // снапшот не пришёл или рендер упал.
        function renderDataCount() {
            var el = document.getElementById('ws-status');
            if (el && STOCK.products.length) {
                el.textContent = 'онлайн · ' + STOCK.products.length + ' поз.';
            }
        }

        // Состояние группы: явное переключение («+»/«-») или дефолт страницы
        // («Сроки» — свёрнуты, шорт-лист — раскрыты).
        function isGroupCollapsed(g) {
            return Object.prototype.hasOwnProperty.call(STOCK.collapsed, g)
                ? STOCK.collapsed[g]
                : STOCK.defaultCollapsed;
        }

        function toggleGroup(g) {
            STOCK.collapsed[g] = !isGroupCollapsed(g);
            render();
        }

        // Строка группы: отдельная ячейка «+»/«-» слева + название (клик по
        // названию — «Обновить сроки группы», обработчик onBodyClick).
        // Отображаемое имя — последний сегмент group_name после «/»
        // («Ассортимент на продажу/003 - Cresud» → «003 - Cresud»).
        function groupRow(g, collapsed, colspan) {
            var sign = collapsed ? '+' : '-';
            var label = groupLabel(g) || 'Без группы';
            return '<tr class="group-row">' +
                '<td class="col-toggle" data-role="group-toggle" data-group="' + esc(g) + '" title="' + (collapsed ? 'Развернуть группу' : 'Свернуть группу') + '">' + sign + '</td>' +
                '<td colspan="' + colspan + '" data-role="group" data-group="' + esc(g) + '">' + esc(label) + '</td></tr>';
        }

        // Усечённое имя группы для отображения: последний сегмент полного пути
        // group_name («Ассортимент на продажу/003 - Cresud» → «003 - Cresud»).
        function groupLabel(g) {
            var s = String(g || '');
            var i = s.lastIndexOf('/');
            if (i >= 0) {
                s = s.slice(i + 1);
            }
            return s.replace(/^\s+|\s+$/g, '');
        }

        function productRow(p, n) {
            var lots = visibleLots(p);
            var html = '<tr data-row-product="' + esc(p.id) + '">';
            html += '<td class="col-toggle"></td>';
            // tabindex="-1" — строка может получить фокус (поиск), в обход Tab.
            html += '<td class="col-name" tabindex="-1" data-role="name" data-product="' + esc(p.id) + '">' + esc(p.name) + '</td>';
            for (var k = 0; k < n; k++) {
                if (k < lots.length) {
                    var lot = lots[k];
                    var tone = onlySurplus(lot) ? ' only-surplus' : (hasDiscount(lot) ? ' has-discount' : '');
                    var blue = expiresToday(lot.best_before) ? ' expires-today' : '';
                    html += '<td class="cell-pair' + tone + blue + '" data-lot="1" data-product="' + esc(p.id) + '" data-bb="' + lot.best_before + '" data-field="qty">' + lot.qty + '</td>';
                    html += '<td class="cell-pair' + tone + blue + '" data-lot="1" data-product="' + esc(p.id) + '" data-bb="' + lot.best_before + '" data-field="date">' + fmtDate(lot.best_before) + '</td>';
                } else {
                    html += '<td class="cell-empty"></td><td class="cell-empty"></td>';
                }
            }
            html += '<td class="cell-discount">' + fmtDiscount(rightDiscount(p, lots, 'general')) + '</td>';
            html += '<td class="cell-discount">' + fmtDiscount(rightDiscount(p, lots, 'telegram')) + '</td>';
            html += '</tr>';
            return html;
        }

        // Срок годности заканчивается сегодня (локальная дата склада) — подсветить «на заморозку».
        function expiresToday(bb) {
            return String(bb).slice(0, 10) === todayStr();
        }

        function todayStr() {
            var d = new Date();
            var m = d.getMonth() + 1;
            var day = d.getDate();
            return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
        }

        // Значение колонки «просто»: ноль — legacy-«скидки нет» (правило «0 = NULL»
        // для plain-колонок), поэтому ноль и отсутствие поля равнозначны — оба null.
        function discountValue(v) {
            return (v == null || v === 0) ? null : v;
        }

        // Значение РУЧНОЙ скидки: заданный ноль — это скидка 0 % и запрет расчёта
        // по этой и более дальним парам (решение владельца, сентябрь 2026),
        // поэтому null отдаёт только отсутствие поля.
        function manualValue(v) {
            return (v == null) ? null : v;
        }

        // Жёлтая подсветка: у пары есть скидка-значение (больше нуля) — ручная или
        // расчётная. Ручная 0 % (запрет менеджера) подсветки не даёт: скидки нет.
        // Пара, накрытая каскадным запретом, приходит без значения в колонке «просто»
        // (движок её снимает), поэтому отдельной логики запрета на клиенте нет.
        function hasDiscount(lot) {
            var gen = effectiveDiscount(lot, 'general');
            if (gen != null && gen > 0) {
                return true;
            }
            var tg = effectiveDiscount(lot, 'telegram');
            return tg != null && tg > 0;
        }

        // Нежно-розовая подсветка: у пары ТОЛЬКО избыток — метка «surplus» и
        // ручных скидок нет. Лот «и срок, и избыток» жёлтый (метка одна, её
        // ставит движок по тому, что записал).
        function onlySurplus(lot) {
            return (lot.discount_source || '') === 'surplus' && !hasManualDiscount(lot);
        }

        // Ручная скидка UI: заданное значение в manual-колонке; ноль — тоже
        // заданное (скидка 0 %, запрет), а не «пусто».
        function hasManualDiscount(lot) {
            return manualValue(lot.discount_general_manual) != null ||
                manualValue(lot.discount_telegram_manual) != null;
        }

        // Effective канала = COALESCE(manual, NULLIF(plain,0)): ручная важнее
        // «просто» и перекрывает её как есть, включая заданный ноль (0 %).
        function effectiveDiscount(lot, channel) {
            var manual = (channel === 'general') ? lot.discount_general_manual : lot.discount_telegram_manual;
            var plain = (channel === 'general') ? lot.discount_general : lot.discount_telegram;
            var m = manualValue(manual);
            return (m != null) ? m : discountValue(plain);
        }

        // Активные пары окна («12 актуальных»): их скидки показываем в правых
        // колонках. У «дополнительных» пар подсветка остаётся, а значение видно
        // только в карточке количества (там, где ручная коррекция) — решение
        // владельца 23.09.2026. Список считает модуль скидок (владелец окна) и
        // отдаёт парами «<товар>|<ГГГГ-ММ-ДД>».
        var ACTIVE_LOTS = null; // null — списка ещё нет: показываем как раньше

        function lotKey(p, lot) {
            return p.id + '|' + String(lot.best_before).slice(0, 10);
        }

        // Пара в окне? Пока список не загружен, считаем «в окне» — иначе скидки
        // пропали бы с экрана до ответа сервера.
        function inWindow(p, lot) {
            return ACTIVE_LOTS === null || ACTIVE_LOTS[lotKey(p, lot)] === true;
        }

        // Список активных пар обновляем при загрузке и раз в минуту: окно
        // пересчитывается реже (часовой тик избытка, утренний по сроку).
        function loadActiveLots() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/ms/discounts/active', true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4 || xhr.status !== 200) {
                    return; // модуль недоступен — остаётся прошлый список
                }
                var data;
                try {
                    data = JSON.parse(xhr.responseText);
                } catch (e) {
                    return;
                }
                var set = {};
                var lots = data.lots || [];
                for (var i = 0; i < lots.length; i++) {
                    set[lots[i]] = true;
                }
                ACTIVE_LOTS = set;
                render();
            };
            xhr.send();
        }

        // Правая колонка канала («Активные скидки»): значение самой левой пары,
        // у которой оно заполнено И которая входит в окно активных (12). Всегда
        // пересчёт из лотов — в базе отдельного поля «активная скидка» нет.
        // Пара за ёмкостью окна значения в колонке не даёт: её скидка видна
        // только в карточке количества (подсветка лота при этом остаётся).
        function rightDiscount(p, lots, channel) {
            for (var i = 0; i < lots.length; i++) {
                var v = effectiveDiscount(lots[i], channel);
                if (v != null && inWindow(p, lots[i])) {
                    return v;
                }
            }
            return null;
        }

        function fmtDiscount(v) {
            return (v == null) ? '' : v + '%';
        }

        function fmtDate(s) {
            s = String(s).slice(0, 10);
            var parts = s.split('-');
            if (parts.length !== 3) {
                return s;
            }
            return parts[2] + '.' + parts[1] + '.' + parts[0];
        }

        function esc(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // --- поиск позиции («похожее» по названию, страница «Сроки») ---
        //
        // Оператор набирает часть названия — под полем поиска появляются похожие
        // позиции; выбор стрелками/мышью + Enter раскрывает группу позиции,
        // переносит фокус на её строку и мигает строкой, чтобы её было видно
        // в длинной таблице. На шорт-листе поиска нет (initSearch выходит).

        var SEARCH = { hits: [], sel: -1 }; // hits: [{p, score, html, name}]
        var SEARCH_LIMIT = 12;              // сколько подсказок показываем
        var SEARCH_MIN_FUZZY = 3;           // запрос короче — только точная подстрока
        var PENDING_FOCUS = null;           // {product, until} — ждём перерисовки tbody

        function initSearch() {
            var input = document.getElementById('dates-search');
            if (!input) {
                return; // шорт-лист: поля поиска нет
            }
            input.addEventListener('input', onSearchInput);
            input.addEventListener('keydown', onSearchKey);
            // Клик по подсказке: прячем список с паузой, иначе blur успевает
            // убрать его до того, как клик дойдёт до пункта.
            input.addEventListener('blur', function () {
                setTimeout(hideHits, 150);
            });
            document.getElementById('dates-hits').addEventListener('click', onHitClick);
        }

        function onSearchInput() {
            var q = document.getElementById('dates-search').value;
            if (q.replace(/^\s+|\s+$/g, '') === '') {
                SEARCH.hits = [];
                SEARCH.sel = -1;
                hideHits();
                return;
            }
            SEARCH.hits = searchProducts(q);
            SEARCH.sel = SEARCH.hits.length ? 0 : -1; // лучший вариант подсвечен сразу
            renderHits();
        }

        // Стрелки — выбор, Enter — переход, Esc — закрыть список.
        // keyCode читаем вместе с key: старые браузеры склада знают только keyCode.
        function onSearchKey(ev) {
            var kc = ev.keyCode || ev.which || 0;
            var key = ev.key || '';
            if (kc === 40 || key === 'ArrowDown' || key === 'Down') {
                ev.preventDefault();
                moveSel(1);
            } else if (kc === 38 || key === 'ArrowUp' || key === 'Up') {
                ev.preventDefault();
                moveSel(-1);
            } else if (kc === 13 || key === 'Enter') {
                ev.preventDefault();
                activateHit();
            } else if (kc === 27 || key === 'Escape' || key === 'Esc') {
                hideHits();
            }
        }

        function moveSel(step) {
            var n = SEARCH.hits.length;
            if (!n) {
                return;
            }
            var i = SEARCH.sel + step;
            if (i < 0) {
                i = n - 1;
            }
            if (i >= n) {
                i = 0;
            }
            SEARCH.sel = i;
            renderHits();
            scrollHitIntoView(i);
        }

        // Подсвеченный пункт не должен уехать за границу прокручиваемого списка.
        function scrollHitIntoView(i) {
            var box = document.getElementById('dates-hits');
            var item = box.getElementsByTagName('div')[i];
            if (!item) {
                return;
            }
            var top = item.offsetTop;
            var bottom = top + item.offsetHeight;
            if (top < box.scrollTop) {
                box.scrollTop = top;
            } else if (bottom > box.scrollTop + box.clientHeight) {
                box.scrollTop = bottom - box.clientHeight;
            }
        }

        function onHitClick(ev) {
            var box = document.getElementById('dates-hits');
            var el = ev.target || ev.srcElement;
            while (el && el !== box && el.nodeType === 1) {
                var idx = el.getAttribute ? el.getAttribute('data-hit') : null;
                if (idx !== null && idx !== undefined && idx !== '') {
                    SEARCH.sel = parseInt(idx, 10);
                    activateHit();
                    return;
                }
                el = el.parentNode;
            }
        }

        // Enter (или клик): раскрыть группу позиции, показать и подсветить строку.
        function activateHit() {
            if (!SEARCH.hits.length) {
                var q = document.getElementById('dates-search').value;
                setStatus(q.replace(/^\s+|\s+$/g, '') === ''
                    ? 'поиск: начните вводить название позиции'
                    : 'поиск: ничего не найдено — уточните название', 'offline');
                return;
            }
            if (SEARCH.sel < 0) {
                SEARCH.sel = 0; // Enter без стрелок — самый похожий вариант
            }
            var p = SEARCH.hits[SEARCH.sel].p;
            hideHits();
            revealProduct(p.id);
        }

        function revealProduct(id) {
            var p = findProduct(id);
            if (!p) {
                setStatus('позиция не найдена — данные обновились, повторите поиск', 'offline');
                return;
            }
            STOCK.collapsed[p.group_name || ''] = false; // группа позиции раскрыта
            PENDING_FOCUS = { product: id, until: nowMs() + 5000 };
            render(); // перерисовка вызовет applyPendingFocus()
        }

        function nowMs() {
            return new Date().getTime();
        }

        // Фокус ставим ПОСЛЕ перерисовки: render() собирает tbody заново,
        // ссылку на строку хранить нельзя — ищем по data-row-product.
        // Ждём до 5 с: строка может появиться не в этой перерисовке (ws-дельта).
        function applyPendingFocus() {
            if (!PENDING_FOCUS) {
                return;
            }
            if (nowMs() > PENDING_FOCUS.until) {
                PENDING_FOCUS = null;
                return;
            }
            var row = rowByProduct(PENDING_FOCUS.product);
            if (!row) {
                return;
            }
            var id = PENDING_FOCUS.product;
            PENDING_FOCUS = null;
            blinkStart(id); // мигание: своим таймером, см. ниже
            var cell = nameCell(row);
            if (cell && cell.focus) {
                try {
                    cell.focus(); // фокус на строку — до прокрутки
                } catch (e) { /* браузер может отказать — мигания достаточно */ }
            }
            scrollRowIntoView(row);
        }

        // Мигание найденной строки делаем сами, inline-фоном по ячейкам:
        // CSS-анимация на td в старых браузерах склада не отрисовывалась, а класс
        // слетал при каждой пересборке tbody (ws-изменение, опрос окна раз в минуту).
        // Каждую итерацию строку ищем заново — ссылка на ячейки устаревает.
        var BLINK_STEPS = 6;    // сколько раз мигнуть
        var BLINK_HALF_MS = 200; // половина цикла вкл/выкл (6 * 2 * 200 мс = 2.4 с)
        var BLINK_COLOR = '#7A1B22';
        var BLINK = { product: null, left: 0, on: false, timer: 0 };

        function blinkStart(id) {
            blinkStop();
            BLINK.product = id;
            BLINK.left = BLINK_STEPS;
            BLINK.on = false;
            blinkTick();
        }

        function blinkStop() {
            if (BLINK.timer) {
                clearTimeout(BLINK.timer);
                BLINK.timer = 0;
            }
            if (BLINK.product) {
                blinkPaint(BLINK.product, '');
            }
            BLINK.product = null;
            BLINK.left = 0;
            BLINK.on = false;
        }

        // Покрасить ячейки строки: цвет — мигание, пустая строка — как было.
        function blinkPaint(id, color) {
            var row = rowByProduct(id);
            if (!row) {
                return;
            }
            var tds = row.getElementsByTagName('td');
            for (var i = 0; i < tds.length; i++) {
                tds[i].style.backgroundColor = color;
            }
        }

        function blinkTick() {
            var id = BLINK.product;
            if (!id || BLINK.left <= 0) {
                blinkStop();
                return;
            }
            BLINK.on = !BLINK.on;
            blinkPaint(id, BLINK.on ? BLINK_COLOR : '');
            if (BLINK.on) {
                BLINK.left = BLINK.left - 1;
            }
            BLINK.timer = setTimeout(blinkTick, BLINK_HALF_MS);
        }

        // Пересборка tbody сносит inline-фон: пока мигание идёт — красим снова.
        function blinkReapply() {
            if (BLINK.product && BLINK.on) {
                blinkPaint(BLINK.product, BLINK_COLOR);
            }
        }

        function rowByProduct(id) {
            var rows = document.getElementById('stock-body').getElementsByTagName('tr');
            for (var i = 0; i < rows.length; i++) {
                if (rows[i].getAttribute('data-row-product') === id) {
                    return rows[i];
                }
            }
            return null;
        }

        function nameCell(row) {
            var tds = row.getElementsByTagName('td');
            for (var i = 0; i < tds.length; i++) {
                if (tds[i].getAttribute('data-role') === 'name') {
                    return tds[i];
                }
            }
            return null;
        }

        // Строку ставим не под самый верх экрана, а с запасом: над ней должна
        // остаться шапка таблицы — иначе непонятно, в какой колонке числа.
        function scrollRowIntoView(row) {
            var rect = row.getBoundingClientRect();
            var top = (window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0) + rect.top;
            var y = top - 120;
            if (y < 0) {
                y = 0;
            }
            window.scrollTo(0, y);
        }

        function hideHits() {
            var box = document.getElementById('dates-hits');
            if (box) {
                box.className = 'hits hidden';
            }
        }

        function renderHits() {
            var box = document.getElementById('dates-hits');
            if (!SEARCH.hits.length) {
                box.innerHTML = '<div class="hit-none">ничего не найдено — уточните название</div>';
                box.className = 'hits';
                return;
            }
            var html = '';
            for (var i = 0; i < SEARCH.hits.length; i++) {
                var h = SEARCH.hits[i];
                html += '<div class="hit' + (i === SEARCH.sel ? ' sel' : '') + '" data-hit="' + i + '" data-product="' + esc(h.p.id) + '">' +
                    '<span class="hit-name">' + h.html + '</span>' +
                    '<span class="hit-group">' + esc(groupLabel(h.p.group_name || '')) + '</span>' +
                    '</div>';
            }
            box.innerHTML = html;
            box.className = 'hits';
        }

        // Похожие позиции: подстрока (начало названия — выше), затем «все слова
        // запроса», затем буквы запроса по порядку (опечатки/пропуски). Скорее
        // всего нужный товар — первым: сортировка по очкам, при равенстве — короткое имя.
        function searchProducts(query) {
            var q = fold(query);
            if (norm(q) === '') {
                return [];
            }
            var out = [];
            for (var i = 0; i < STOCK.products.length; i++) {
                var p = STOCK.products[i];
                if (STOCK.shortList && !p.short_list) {
                    continue;
                }
                var name = p.name || '';
                var score = scoreName(name, q);
                if (score > 0) {
                    out.push({ p: p, score: score, name: name, html: highlightName(name, q) });
                }
            }
            out.sort(function (a, b) {
                if (a.score !== b.score) {
                    return b.score - a.score;
                }
                if (a.name.length !== b.name.length) {
                    return a.name.length - b.name.length;
                }
                return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
            });
            if (out.length > SEARCH_LIMIT) {
                out = out.slice(0, SEARCH_LIMIT);
            }
            return out;
        }

        function scoreName(name, q) {
            var n = fold(name);
            if (q === '') {
                return 0;
            }
            if (n === q) {
                return 1000;
            }
            var idx = n.indexOf(q);
            if (idx === 0) {
                return 950 - Math.min(60, n.length - q.length);
            }
            if (idx > 0) {
                return (isWordStart(n, idx) ? 850 : 780) - Math.min(80, idx);
            }

            // все слова запроса (в любом порядке) есть в названии подстрокой
            var qw = splitWords(q);
            var nw = splitWords(n);
            var hit = 0;
            var first = -1;
            var last = -1;
            for (var i = 0; i < qw.length; i++) {
                for (var j = 0; j < nw.length; j++) {
                    if (nw[j].indexOf(qw[i]) !== -1) {
                        hit++;
                        if (first < 0) {
                            first = j;
                        }
                        last = j;
                        break;
                    }
                }
            }
            if (qw.length > 1 && hit === qw.length) {
                return 600 - 4 * (last - first);
            }

            // «похожее»: буквы запроса идут по порядку, часть букв пропущена
            var qc = q.replace(/\s+/g, '');
            if (qc.length >= SEARCH_MIN_FUZZY) {
                var sub = subsequence(n, qc);
                if (sub >= 0) {
                    return sub;
                }
            }
            return 0;
        }

        // Очки за «буквы по порядку»: чем длиннее непрерывный кусок совпадения и
        // меньше пропусков, тем выше. -1 — запрос не проходит по порядку.
        function subsequence(s, q) {
            var qi = 0;
            var gaps = 0;
            var run = 0;
            var best = 0;
            for (var si = 0; si < s.length && qi < q.length; si++) {
                if (s.charAt(si) === q.charAt(qi)) {
                    qi++;
                    run++;
                    if (run > best) {
                        best = run;
                    }
                } else if (run > 0) {
                    gaps++;
                    run = 0;
                }
            }
            if (qi < q.length) {
                return -1;
            }
            var score = 60 + best * 20 - gaps * 10;
            if (score < 0) {
                return 0;
            }
            return score > 200 ? 200 : score;
        }

        // Приведение к нижнему регистру БЕЗ изменения длины (индексы годятся для
        // подсветки), ё → е: «филе» находит «ФИЛЕ», «ёж» — «еж».
        function fold(s) {
            return String(s == null ? '' : s).toLowerCase().replace(/ё/g, 'е');
        }

        // Нормализация для сравнения слов: знаки препинания и лишние пробелы не значимы.
        function norm(s) {
            return fold(s).replace(/[^0-9a-zа-я]+/g, ' ').replace(/^\s+|\s+$/g, '');
        }

        function splitWords(s) {
            var parts = norm(s).split(' ');
            var out = [];
            for (var i = 0; i < parts.length; i++) {
                if (parts[i] !== '') {
                    out.push(parts[i]);
                }
            }
            return out;
        }

        // Совпадение на границе слова («кур» в «филе кур/бедро») весит больше,
        // чем совпадение внутри слова.
        function isWordStart(s, i) {
            if (i === 0) {
                return true;
            }
            var c = s.charAt(i - 1);
            return c === ' ' || c === '-' || c === '(' || c === ',' || c === '/';
        }

        // Подсветка найденного куска (только для точной подстроки: при «похожем»
        // подсвечивать нечего). Экранирование по частям — HTML из названия не пройдёт.
        function highlightName(name, q) {
            var n = fold(name);
            var idx = n.indexOf(q);
            if (q === '' || idx < 0) {
                return esc(name);
            }
            return esc(name.slice(0, idx)) + '<b>' + esc(name.slice(idx, idx + q.length)) + '</b>' +
                esc(name.slice(idx + q.length));
        }

        // --- клики по ячейкам ---

        function onBodyClick(ev) {
            var el = ev.target || ev.srcElement;
            while (el && el !== this && el.nodeType === 1) {
                if (el.getAttribute) {
                    var role = el.getAttribute('data-role');
                    if (role === 'name') {
                        openNameModal(el.getAttribute('data-product'));
                        return;
                    }
                    if (role === 'group-toggle') {
                        toggleGroup(el.getAttribute('data-group'));
                        return;
                    }
                    if (role === 'group') {
                        openGroupModal(el.getAttribute('data-group'));
                        return;
                    }
                    if (el.getAttribute('data-lot') === '1') {
                        var field = el.getAttribute('data-field');
                        var productID = el.getAttribute('data-product');
                        var bb = el.getAttribute('data-bb');
                        if (field === 'qty') {
                            openDiscountModal(productID, bb);
                        } else if (field === 'date') {
                            openDateModal(productID, bb);
                        }
                        return;
                    }
                }
                el = el.parentNode;
            }
        }

        // --- модальные окна ---

        function showModal(html) {
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal-overlay').className = 'overlay';
        }

        function closeModal() {
            document.getElementById('modal-overlay').className = 'overlay hidden';
            document.getElementById('modal-content').innerHTML = '';
            MODAL.productID = null;
            MODAL.bb = null;
            UPDATE_CTX = null;
        }

        // Клик по количеству: факт (текущая скидка) / Ставим (ручная).
        function openDiscountModal(productID, bb) {
            var p = findProduct(productID);
            if (!p) {
                return;
            }
            var lot = findLot(p, bb);
            if (!lot) {
                return;
            }
            MODAL.productID = productID;
            MODAL.bb = bb;

            var genFact = fmtDiscount(effectiveDiscount(lot, 'general'));
            var tgFact = fmtDiscount(effectiveDiscount(lot, 'telegram'));
            // Ручные колонки: 0 — это скидка 0 % (запрет), показываем как есть;
            // пустое поле — ручного применения нет.
            var genManual = manualValue(lot.discount_general_manual);
            var tgManual = manualValue(lot.discount_telegram_manual);
            var genVal = (genManual != null) ? genManual : '';
            var tgVal = (tgManual != null) ? tgManual : '';

            var html = '<div class="modal-title">' + esc(p.name) + ' — годен до ' + fmtDate(bb) + '</div>';
            html += '<table class="discount-table">';
            html += '<tr><th></th><th>general</th><th>telegram</th></tr>';
            html += '<tr><td class="dl">факт</td><td>' + genFact + '</td><td>' + tgFact + '</td></tr>';
            html += '<tr><td class="dl">Ставим</td>';
            html += '<td><input type="number" id="d-gen" min="0" max="100" value="' + genVal + '"></td>';
            html += '<td><input type="number" id="d-tg" min="0" max="100" value="' + tgVal + '"></td></tr>';
            html += '</table>';
            html += '<div class="modal-hint">Пустое поле = сброс ручной скидки. 0 = скидки нет: блокирует этот срок и все более дальние сроки товара</div>';
            html += '<div class="modal-actions">';
            html += '<button type="button" onclick="closeModal()">Отмена</button>';
            html += '<button type="button" onclick="saveDiscount()">Сохранить</button>';
            html += '</div>';
            showModal(html);
        }

        function saveDiscount() {
            var gen = parseDiscountInput(document.getElementById('d-gen').value);
            var tg = parseDiscountInput(document.getElementById('d-tg').value);
            var body = JSON.stringify({
                product_id: MODAL.productID,
                best_before: String(MODAL.bb).slice(0, 10),
                discount_general_manual: gen,
                discount_telegram_manual: tg
            });
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/ms/dates/discount', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) {
                    return;
                }
                if (xhr.status === 204) {
                    // Ручная ТГ-скидка занимает место в окне (владелец, 29.09.2026):
                    // список окна берём сразу, не дожидаясь минутного опроса.
                    loadActiveLots();
                    closeModal();
                } else {
                    alert('Не удалось сохранить скидку (HTTP ' + xhr.status + ')');
                }
            };
            xhr.send(body);
        }

        function parseDiscountInput(v) {
            v = String(v).trim();
            if (v === '') {
                return null;
            }
            var n = parseInt(v, 10);
            if (isNaN(n)) {
                return null;
            }
            return n;
        }

        // Клик по сроку: дата выработки.
        function openDateModal(productID, bb) {
            var p = findProduct(productID);
            if (!p) {
                return;
            }
            var lot = findLot(p, bb);
            if (!lot) {
                return;
            }
            var produced = lot.produced_on ? fmtDate(lot.produced_on) : 'не известна';
            var html = '<div class="modal-title">' + esc(p.name) + ' — годен до ' + fmtDate(bb) + '</div>';
            html += '<div class="modal-line">Дата выработки: ' + produced + '</div>';
            html += '<div class="modal-actions">';
            html += '<button type="button" onclick="closeModal()">Закрыть</button>';
            html += '</div>';
            showModal(html);
        }

        // Клик по названию: обновить сроки одной позиции (ограничение — код товара).
        function openNameModal(productID) {
            var p = findProduct(productID);
            if (!p) {
                return;
            }
            if (!p.internal_code) {
                // Обновление по товару ограничено его внутренним кодом: без
                // кода страница вернула бы 400 сырым текстом — говорим прямо.
                showModal('<div class="modal-title">' + esc(p.name) + '</div>' +
                    '<div class="modal-line">У товара нет внутреннего кода — обновить сроки по нему нельзя. ' +
                    'Заведите код в МС и выгрузите каталог.</div>' +
                    '<div class="modal-actions"><button type="button" onclick="closeModal()">Закрыть</button></div>');
                return;
            }
            UPDATE_CTX = { kind: 'product', id: p.id, name: p.name, code: p.internal_code };
            var html = '<div class="modal-title">' + esc(p.name) + '</div>';
            if (p.internal_code) {
                html += '<div class="modal-line">Код: ' + esc(p.internal_code) + '</div>';
            }
            html += '<div class="modal-actions">';
            html += '<button type="button" onclick="closeModal()">Отмена</button>';
            html += '<button type="button" data-update="1">Обновить сроки ' + esc(p.name) + '</button>';
            html += '</div>';
            showModal(html);
        }

        // Клик по группе: обновить сроки группы (ограничение — 3 цифры кода группы).
        function openGroupModal(groupName) {
            var code = groupCode(groupName);
            if (!code) {
                // Раньше выходили молча — кнопка «Обновить сроки группы»
                // выглядела нерабочей. Группе номера нет, если у её товаров
                // пустой внутренний код.
                setStatus('у группы нет номера в внутреннем коде — обновление по группе недоступно', 'offline');
                return;
            }
            var display = groupLabel(groupName) || 'Без группы';
            UPDATE_CTX = { kind: 'group', code: code, name: display };
            var html = '<div class="modal-title">' + esc(display) + '</div>';
            html += '<div class="modal-line">Группа: ' + code + '</div>';
            html += '<div class="modal-actions">';
            html += '<button type="button" onclick="closeModal()">Отмена</button>';
            html += '<button type="button" data-update="1">Обновить сроки ' + esc(display) + '</button>';
            html += '</div>';
            showModal(html);
        }

        // Первые 3 цифры ОТОБРАЖАЕМОГО названия группы — номер группы в
        // internal_code (индексы 1..3). Полный group_name усекается до
        // последнего сегмента («…/003 - Cresud» → «003»).
        function groupCode(name) {
            // Номер группы = цифры 1..3 внутреннего кода (у товаров группы он
            // один) — берём из данных снапшота. Разбор отображаемого названия
            // остаётся фолбэком: у названий вида «Специи 001» ведущих цифр нет,
            // и раньше это давало тихий отказ кнопки.
            if (STOCK.products) {
                for (var i = 0; i < STOCK.products.length; i++) {
                    var p = STOCK.products[i];
                    if (p.group_name === name && p.internal_code && p.internal_code.length >= 4) {
                        return p.internal_code.slice(1, 4);
                    }
                }
            }
            var m = /^(\d{3})/.exec(groupLabel(name));
            return m ? m[1] : null;
        }

        // Контекст читаем ДО закрытия окна: closeModal() затирает UPDATE_CTX
        // (MODAL/UPDATE_CTX — состояние окна), из-за чего кнопка «Обновить
        // сроки …» гасила модалку и молча выходила — перехода не было.
        function goUpdate() {
            var c = UPDATE_CTX;
            closeModal();
            if (!c) {
                setStatus('контекст обновления потерян — откройте окно заново', 'offline');
                return;
            }
            var url = (c.kind === 'product')
                ? '/ms/dates/update?product_id=' + encodeURIComponent(c.id)
                : '/ms/dates/update?group=' + encodeURIComponent(c.code);
            window.location.href = url;
        }

        function findLot(p, bb) {
            for (var i = 0; i < p.lots.length; i++) {
                if (p.lots[i].best_before === bb) {
                    return p.lots[i];
                }
            }
            return null;
        }

        initStock();
    </script>

</body>
