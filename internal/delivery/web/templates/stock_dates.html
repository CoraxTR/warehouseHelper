<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{{if .ShortList}}Шорт-лист — Сроки{{else}}Сроки{{end}}</title>
    <link rel="stylesheet" href="/static/raven-guard.css">
</head>

<body data-short="{{if .ShortList}}1{{else}}0{{end}}">
    <header class="brandbar">
        <a class="brandbar__brand" href="/"><svg class="brandbar__emblem" viewBox="0 0 64 64" aria-hidden="true"><circle cx="35" cy="25" r="14" fill="#F4F1E9"/><polygon points="6,26 30,17 28,27" fill="#F4F1E9"/><polygon points="13,35 28,27 26,36" fill="#F4F1E9"/><circle cx="34" cy="23" r="3.6" fill="#0A0A0D"/><circle cx="33" cy="22" r="1.1" fill="#C02832"/></svg><span class="brandbar__name">ВОРОН&nbsp;&middot;&nbsp;СКЛАД</span></a>
        <span class="brandbar__motto">Приёмка или смерть</span>
    </header>

    <div class="topbar">
        <h1>{{if .ShortList}}Шорт-лист{{else}}Сроки{{end}}</h1>
        <div class="top-actions">
            {{if .ShortList}}<a class="btn" href="/ms/dates">← Сроки</a>{{else}}<a class="btn" href="/ms/dates/short">Шорт-лист</a>{{end}}
            <a class="btn btn-green" href="/ms/dates/update">Обновить сроки</a>
            <span id="ws-status">подключение…</span>
        </div>
    </div>

    <table id="stock-table">
        <thead>
            <tr id="head-row"></tr>
        </thead>
        <tbody id="stock-body"></tbody>
    </table>

    <div id="modal-overlay" class="overlay hidden">
        <div class="modal">
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        // Модуль «Сроки»: таблица остатков по срокам годности, обновление по вебсокету.
        // Только ES5 (старые браузеры склада): без :scope, NodeList.forEach, стрелок и шаблонных строк.

        var STOCK = {
            products: [],   // упорядоченный список (group_name, name, best_before — от сервера)
            index: {},      // product_id -> индекс в products
            shortList: false,
            defaultCollapsed: true, // «Сроки» — группы свёрнуты; шорт-лист — раскрыты
            collapsed: {},  // явно переключённые группы: group_name -> true/false
            ws: null,
            reconnTimer: null,
            renderTimer: null
        };

        var MODAL = { productID: null, bb: null };
        var UPDATE_CTX = null; // контекст кнопки «Обновить сроки …» в модалке

        function initStock() {
            STOCK.shortList = (document.body.getAttribute('data-short') === '1');
            STOCK.defaultCollapsed = !STOCK.shortList;
            document.getElementById('stock-body').addEventListener('click', onBodyClick);
            var overlay = document.getElementById('modal-overlay');
            overlay.addEventListener('click', function (ev) {
                if (ev.target === overlay) {
                    closeModal();
                }
            });
            // Кнопка «Обновить сроки …» в модалке (делегирование, без inline-обработчиков с данными).
            var mc = document.getElementById('modal-content');
            mc.addEventListener('click', function (ev) {
                var t = ev.target || ev.srcElement;
                while (t && t !== mc) {
                    if (t.getAttribute && t.getAttribute('data-update') === '1') {
                        goUpdate();
                        return;
                    }
                    t = t.parentNode;
                }
            });
            connect();
        }

        // --- вебсокет ---

        function connect() {
            var proto = (window.location.protocol === 'https:') ? 'wss://' : 'ws://';
            STOCK.ws = new WebSocket(proto + window.location.host + '/ms/dates/ws');
            STOCK.ws.onopen = function () {
                setStatus('онлайн', 'online');
            };
            STOCK.ws.onmessage = function (ev) {
                var msg;
                try {
                    msg = JSON.parse(ev.data);
                } catch (e) {
                    return;
                }
                onMessage(msg);
            };
            STOCK.ws.onclose = function () {
                setStatus('переподключение…', 'offline');
                scheduleReconnect();
            };
            STOCK.ws.onerror = function () {
                try {
                    STOCK.ws.close();
                } catch (e) { /* noop */ }
            };
        }

        function scheduleReconnect() {
            if (STOCK.reconnTimer) {
                return;
            }
            STOCK.reconnTimer = setTimeout(function () {
                STOCK.reconnTimer = null;
                connect();
            }, 3000);
        }

        function setStatus(text, cls) {
            var el = document.getElementById('ws-status');
            el.textContent = text;
            el.className = cls || '';
        }

        function onMessage(msg) {
            if (msg.type === 'snapshot') {
                applySnapshot(msg.rows || []);
            } else if (msg.type === 'lot_upsert') {
                applyLotUpsert(msg);
            } else if (msg.type === 'lot_delete') {
                applyLotDelete(msg);
            } else if (msg.type === 'product_delete') {
                applyProductDelete(msg);
            }
            scheduleRender();
        }

        function applySnapshot(rows) {
            STOCK.products = rows;
            reindex();
        }

        // Дельта для известного товара; неизвестный игнорируем —
        // снапшот всегда приходит первым, новых товаров эта версия не добавляет.
        function applyLotUpsert(msg) {
            var p = findProduct(msg.product_id);
            if (!p || !msg.lot) {
                return;
            }
            var lot = msg.lot;
            for (var i = 0; i < p.lots.length; i++) {
                if (p.lots[i].best_before === lot.best_before) {
                    p.lots[i] = lot;
                    return;
                }
            }
            p.lots.push(lot);
            p.lots.sort(function (a, b) {
                return a.best_before < b.best_before ? -1 : (a.best_before > b.best_before ? 1 : 0);
            });
        }

        function applyLotDelete(msg) {
            var p = findProduct(msg.product_id);
            if (!p) {
                return;
            }
            for (var i = 0; i < p.lots.length; i++) {
                if (p.lots[i].best_before === msg.best_before) {
                    p.lots.splice(i, 1);
                    return;
                }
            }
        }

        function applyProductDelete(msg) {
            var i = STOCK.index[msg.product_id];
            if (i === undefined) {
                return;
            }
            STOCK.products.splice(i, 1);
            reindex();
        }

        function reindex() {
            STOCK.index = {};
            for (var i = 0; i < STOCK.products.length; i++) {
                STOCK.index[STOCK.products[i].id] = i;
            }
        }

        function findProduct(id) {
            var i = STOCK.index[id];
            return (i === undefined) ? null : STOCK.products[i];
        }

        // --- рендер ---

        function scheduleRender() {
            if (STOCK.renderTimer) {
                return;
            }
            STOCK.renderTimer = setTimeout(function () {
                STOCK.renderTimer = null;
                render();
            }, 80);
        }

        // Пары показываем только для лотов с остатком (qty > 0).
        function visibleLots(p) {
            var out = [];
            for (var i = 0; i < p.lots.length; i++) {
                if (p.lots[i].qty > 0) {
                    out.push(p.lots[i]);
                }
            }
            return out;
        }

        function render() {
            var i, k;
            var items = [];
            for (i = 0; i < STOCK.products.length; i++) {
                var p = STOCK.products[i];
                if (STOCK.shortList && !p.short_list) {
                    continue;
                }
                items.push(p);
            }

            // Ширина таблицы: максимум видимых пар по строкам РАСКРЫТЫХ групп.
            var n = 0;
            for (i = 0; i < items.length; i++) {
                if (isGroupCollapsed(items[i].group_name || '')) {
                    continue;
                }
                var cnt = visibleLots(items[i]).length;
                if (cnt > n) {
                    n = cnt;
                }
            }

            var head = '<tr><th class="col-toggle"></th><th class="col-name">Наименование</th>';
            for (k = 0; k < n; k++) {
                head += '<th>Кол-во</th><th>Срок</th>';
            }
            head += '<th>Скидка сайт</th><th>Скидка ТГ</th></tr>';
            document.getElementById('head-row').innerHTML = head;

            var html = '';
            var lastGroup = null;
            var colspan = 2 * n + 3;
            for (i = 0; i < items.length; i++) {
                var g = items[i].group_name || '';
                if (g !== lastGroup) {
                    lastGroup = g;
                    html += groupRow(g, isGroupCollapsed(g), colspan);
                }
                if (!isGroupCollapsed(g)) {
                    html += productRow(items[i], n);
                }
            }
            document.getElementById('stock-body').innerHTML = html;
        }

        // Состояние группы: явное переключение («+»/«-») или дефолт страницы
        // («Сроки» — свёрнуты, шорт-лист — раскрыты).
        function isGroupCollapsed(g) {
            return Object.prototype.hasOwnProperty.call(STOCK.collapsed, g)
                ? STOCK.collapsed[g]
                : STOCK.defaultCollapsed;
        }

        function toggleGroup(g) {
            STOCK.collapsed[g] = !isGroupCollapsed(g);
            render();
        }

        // Строка группы: отдельная ячейка «+»/«-» слева + название (клик по
        // названию — «Обновить сроки группы», обработчик onBodyClick).
        // Отображаемое имя — последний сегмент group_name после «/»
        // («Ассортимент на продажу/003 - Cresud» → «003 - Cresud»).
        function groupRow(g, collapsed, colspan) {
            var sign = collapsed ? '+' : '-';
            var label = groupLabel(g) || 'Без группы';
            return '<tr class="group-row">' +
                '<td class="col-toggle" data-role="group-toggle" data-group="' + esc(g) + '" title="' + (collapsed ? 'Развернуть группу' : 'Свернуть группу') + '">' + sign + '</td>' +
                '<td colspan="' + colspan + '" data-role="group" data-group="' + esc(g) + '">' + esc(label) + '</td></tr>';
        }

        // Усечённое имя группы для отображения: последний сегмент полного пути
        // group_name («Ассортимент на продажу/003 - Cresud» → «003 - Cresud»).
        function groupLabel(g) {
            var s = String(g || '');
            var i = s.lastIndexOf('/');
            if (i >= 0) {
                s = s.slice(i + 1);
            }
            return s.replace(/^\s+|\s+$/g, '');
        }

        function productRow(p, n) {
            var lots = visibleLots(p);
            var html = '<tr>';
            html += '<td class="col-toggle"></td>';
            html += '<td class="col-name" data-role="name" data-product="' + esc(p.id) + '">' + esc(p.name) + '</td>';
            for (var k = 0; k < n; k++) {
                if (k < lots.length) {
                    var lot = lots[k];
                    var yellow = hasDiscount(lot) ? ' has-discount' : '';
                    var blue = expiresToday(lot.best_before) ? ' expires-today' : '';
                    html += '<td class="cell-pair' + yellow + blue + '" data-lot="1" data-product="' + esc(p.id) + '" data-bb="' + lot.best_before + '" data-field="qty">' + lot.qty + '</td>';
                    html += '<td class="cell-pair' + yellow + blue + '" data-lot="1" data-product="' + esc(p.id) + '" data-bb="' + lot.best_before + '" data-field="date">' + fmtDate(lot.best_before) + '</td>';
                } else {
                    html += '<td class="cell-empty"></td><td class="cell-empty"></td>';
                }
            }
            html += '<td class="cell-discount">' + fmtDiscount(rightDiscount(lots, 'general')) + '</td>';
            html += '<td class="cell-discount">' + fmtDiscount(rightDiscount(lots, 'telegram')) + '</td>';
            html += '</tr>';
            return html;
        }

        // Срок годности заканчивается сегодня (локальная дата склада) — подсветить «на заморозку».
        function expiresToday(bb) {
            return String(bb).slice(0, 10) === todayStr();
        }

        function todayStr() {
            var d = new Date();
            var m = d.getMonth() + 1;
            var day = d.getDate();
            return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
        }

        // Жёлтая подсветка: у пары задана любая скидка (ручная или «просто»).
        function hasDiscount(lot) {
            return lot.discount_general != null ||
                lot.discount_telegram != null ||
                lot.discount_general_manual != null ||
                lot.discount_telegram_manual != null;
        }

        // Ручная скидка всегда важнее «просто».
        function effectiveDiscount(lot, channel) {
            var manual = (channel === 'general') ? lot.discount_general_manual : lot.discount_telegram_manual;
            var plain = (channel === 'general') ? lot.discount_general : lot.discount_telegram;
            return (manual != null) ? manual : plain;
        }

        // Правая колонка канала: значение самой левой пары, у которой оно заполнено.
        function rightDiscount(lots, channel) {
            for (var i = 0; i < lots.length; i++) {
                var v = effectiveDiscount(lots[i], channel);
                if (v != null) {
                    return v;
                }
            }
            return null;
        }

        function fmtDiscount(v) {
            return (v == null) ? '' : v + '%';
        }

        function fmtDate(s) {
            s = String(s).slice(0, 10);
            var parts = s.split('-');
            if (parts.length !== 3) {
                return s;
            }
            return parts[2] + '.' + parts[1] + '.' + parts[0];
        }

        function esc(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // --- клики по ячейкам ---

        function onBodyClick(ev) {
            var el = ev.target || ev.srcElement;
            while (el && el !== this && el.nodeType === 1) {
                if (el.getAttribute) {
                    var role = el.getAttribute('data-role');
                    if (role === 'name') {
                        openNameModal(el.getAttribute('data-product'));
                        return;
                    }
                    if (role === 'group-toggle') {
                        toggleGroup(el.getAttribute('data-group'));
                        return;
                    }
                    if (role === 'group') {
                        openGroupModal(el.getAttribute('data-group'));
                        return;
                    }
                    if (el.getAttribute('data-lot') === '1') {
                        var field = el.getAttribute('data-field');
                        var productID = el.getAttribute('data-product');
                        var bb = el.getAttribute('data-bb');
                        if (field === 'qty') {
                            openDiscountModal(productID, bb);
                        } else if (field === 'date') {
                            openDateModal(productID, bb);
                        }
                        return;
                    }
                }
                el = el.parentNode;
            }
        }

        // --- модальные окна ---

        function showModal(html) {
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal-overlay').className = 'overlay';
        }

        function closeModal() {
            document.getElementById('modal-overlay').className = 'overlay hidden';
            document.getElementById('modal-content').innerHTML = '';
            MODAL.productID = null;
            MODAL.bb = null;
            UPDATE_CTX = null;
        }

        // Клик по количеству: факт (текущая скидка) / Ставим (ручная).
        function openDiscountModal(productID, bb) {
            var p = findProduct(productID);
            if (!p) {
                return;
            }
            var lot = findLot(p, bb);
            if (!lot) {
                return;
            }
            MODAL.productID = productID;
            MODAL.bb = bb;

            var genFact = fmtDiscount(effectiveDiscount(lot, 'general'));
            var tgFact = fmtDiscount(effectiveDiscount(lot, 'telegram'));
            var genVal = (lot.discount_general_manual != null) ? lot.discount_general_manual : '';
            var tgVal = (lot.discount_telegram_manual != null) ? lot.discount_telegram_manual : '';

            var html = '<div class="modal-title">' + esc(p.name) + ' — годен до ' + fmtDate(bb) + '</div>';
            html += '<table class="discount-table">';
            html += '<tr><th></th><th>general</th><th>telegram</th></tr>';
            html += '<tr><td class="dl">факт</td><td>' + genFact + '</td><td>' + tgFact + '</td></tr>';
            html += '<tr><td class="dl">Ставим</td>';
            html += '<td><input type="number" id="d-gen" min="0" max="100" value="' + genVal + '"></td>';
            html += '<td><input type="number" id="d-tg" min="0" max="100" value="' + tgVal + '"></td></tr>';
            html += '</table>';
            html += '<div class="modal-hint">Пустое поле = сброс ручной скидки</div>';
            html += '<div class="modal-actions">';
            html += '<button type="button" onclick="closeModal()">Отмена</button>';
            html += '<button type="button" onclick="saveDiscount()">Сохранить</button>';
            html += '</div>';
            showModal(html);
        }

        function saveDiscount() {
            var gen = parseDiscountInput(document.getElementById('d-gen').value);
            var tg = parseDiscountInput(document.getElementById('d-tg').value);
            var body = JSON.stringify({
                product_id: MODAL.productID,
                best_before: MODAL.bb,
                discount_general_manual: gen,
                discount_telegram_manual: tg
            });
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/ms/dates/discount', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) {
                    return;
                }
                if (xhr.status === 204) {
                    closeModal();
                } else {
                    alert('Не удалось сохранить скидку (HTTP ' + xhr.status + ')');
                }
            };
            xhr.send(body);
        }

        function parseDiscountInput(v) {
            v = String(v).trim();
            if (v === '') {
                return null;
            }
            var n = parseInt(v, 10);
            if (isNaN(n)) {
                return null;
            }
            return n;
        }

        // Клик по сроку: дата выработки.
        function openDateModal(productID, bb) {
            var p = findProduct(productID);
            if (!p) {
                return;
            }
            var lot = findLot(p, bb);
            if (!lot) {
                return;
            }
            var produced = lot.produced_on ? fmtDate(lot.produced_on) : 'не известна';
            var html = '<div class="modal-title">' + esc(p.name) + ' — годен до ' + fmtDate(bb) + '</div>';
            html += '<div class="modal-line">Дата выработки: ' + produced + '</div>';
            html += '<div class="modal-actions">';
            html += '<button type="button" onclick="closeModal()">Закрыть</button>';
            html += '</div>';
            showModal(html);
        }

        // Клик по названию: обновить сроки одной позиции (ограничение — код товара).
        function openNameModal(productID) {
            var p = findProduct(productID);
            if (!p) {
                return;
            }
            UPDATE_CTX = { kind: 'product', id: p.id, name: p.name, code: p.internal_code || '' };
            var html = '<div class="modal-title">' + esc(p.name) + '</div>';
            if (p.internal_code) {
                html += '<div class="modal-line">Код: ' + esc(p.internal_code) + '</div>';
            }
            html += '<div class="modal-actions">';
            html += '<button type="button" onclick="closeModal()">Отмена</button>';
            html += '<button type="button" data-update="1">Обновить сроки ' + esc(p.name) + '</button>';
            html += '</div>';
            showModal(html);
        }

        // Клик по группе: обновить сроки группы (ограничение — 3 цифры кода группы).
        function openGroupModal(groupName) {
            var code = groupCode(groupName);
            if (!code) {
                return; // в названии нет номера группы — обновление по группе недоступно
            }
            var display = groupLabel(groupName) || 'Без группы';
            UPDATE_CTX = { kind: 'group', code: code, name: display };
            var html = '<div class="modal-title">' + esc(display) + '</div>';
            html += '<div class="modal-line">Группа: ' + code + '</div>';
            html += '<div class="modal-actions">';
            html += '<button type="button" onclick="closeModal()">Отмена</button>';
            html += '<button type="button" data-update="1">Обновить сроки ' + esc(display) + '</button>';
            html += '</div>';
            showModal(html);
        }

        // Первые 3 цифры ОТОБРАЖАЕМОГО названия группы — номер группы в
        // internal_code (индексы 1..3). Полный group_name усекается до
        // последнего сегмента («…/003 - Cresud» → «003»).
        function groupCode(name) {
            var m = /^(\d{3})/.exec(groupLabel(name));
            return m ? m[1] : null;
        }

        function goUpdate() {
            closeModal();
            var c = UPDATE_CTX;
            if (!c) {
                return;
            }
            var url = (c.kind === 'product')
                ? '/ms/dates/update?product_id=' + encodeURIComponent(c.id)
                : '/ms/dates/update?group=' + encodeURIComponent(c.code);
            window.location.href = url;
        }

        function findLot(p, bb) {
            for (var i = 0; i < p.lots.length; i++) {
                if (p.lots[i].best_before === bb) {
                    return p.lots[i];
                }
            }
            return null;
        }

        initStock();
    </script>

</body>

</html>
