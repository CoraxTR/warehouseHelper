<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Продукция</title>
    <link rel="stylesheet" href="/static/raven-guard.css">
    <script src="/static/theme.js"></script>
</head>

<body>
    <header class="brandbar">
        <a class="brandbar__brand" href="/"><svg class="brandbar__emblem" viewBox="0 0 64 64" aria-hidden="true"><circle class="em__shade" cx="35" cy="25" r="14"/><polygon class="em__shade" points="6,26 30,17 28,27"/><polygon class="em__shade" points="13,35 28,27 26,36"/><circle class="em__eye" cx="34" cy="23" r="3.6"/><circle class="em__glint" cx="33" cy="22" r="1.1"/></svg><span class="brandbar__name">ВОРОН&nbsp;&middot;&nbsp;СКЛАД</span></a>
        <div class="brandbar__right">
            <span class="brandbar__motto">Приёмка или смерть</span>
            <span class="themeswitch" id="theme-switch">
                <span class="themeswitch__label" id="theme-label"><span class="themeswitch__label-night">Нормальная тема</span><span class="themeswitch__label-day">Любитель щурится</span></span>
                <button class="themeswitch__track" id="theme-toggle" type="button"
                 role="switch" aria-checked="false" aria-label="Тема оформления"
                 title="Переключить на «Любитель щурится»">
                    <span class="themeswitch__knob"></span>
                </button>
            </span>
        </div>
    </header>
    {{template "nav"}}
    <h1>Продукция</h1>
    <p><a href="/ms">← Назад в МойСклад</a></p>

    {{if .Error}}
    <div class="error-banner">{{.Error}}</div>
    {{end}}

    <div class="actions">
        <form method="post" action="/goods/search" class="search-row">
            <input type="text" name="q" value="{{.Query}}" placeholder="Код или название товара" autofocus>
            <button type="submit">Поиск</button>
        </form>
        <a href="/goods/tree"><button class="add-btn">Добавление</button></a>
        <a href="/goods/availability"><button class="add-btn">Доступность товаров</button></a>
        <a href="/goods/stock-report"><button class="add-btn">Отчёт по наличию</button></a>
        <a href="/goods/return"><button class="add-btn">Возврат в продажу</button></a>
        <a href="/goods/withdraw"><button class="add-btn">Вывод из продажи</button></a>
        <a href="/goods/box"><button class="add-btn">Создать коробку</button></a>
    </div>

    {{if .Matches}}
    <div class="matches">
        <h2>Найдено: {{len .Matches}}</h2>
        {{range .Matches}}
        <a href="/goods/edit?id={{.ID}}"><span class="code">{{.InternalCode}}</span>{{.Name}}</a>
        {{end}}
    </div>
    {{end}}
</body>

</html>
