<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Продукция</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            font-size: 24px;
        }

        .actions {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
        }

        .actions input[type="text"] {
            padding: 8px;
            font-size: 15px;
            width: 320px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }

        .actions button {
            padding: 8px 16px;
            font-size: 15px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .actions button:hover {
            background-color: #0056b3;
        }

        .add-btn {
            background-color: #28a745 !important;
        }

        .add-btn:hover {
            background-color: #1e7e34 !important;
        }

        .error-banner {
            color: #b00020;
            background: #ffe6e6;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .matches {
            margin-top: 16px;
        }

        .matches a {
            display: block;
            padding: 6px 0;
            color: #0056b3;
        }

        .matches .code {
            color: #666;
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <h1>Продукция</h1>
    <p><a href="/ms">← Назад в МойСклад</a></p>

    {{if .Error}}
    <div class="error-banner">{{.Error}}</div>
    {{end}}

    <div class="actions">
        <form method="post" action="/goods/search" style="display:flex;gap:8px;margin:0;">
            <input type="text" name="q" value="{{.Query}}" placeholder="Код или название товара" autofocus>
            <button type="submit">Поиск</button>
        </form>
        <a href="/goods/tree"><button class="add-btn">Добавление</button></a>
    </div>

    {{if .Matches}}
    <div class="matches">
        <h2>Найдено: {{len .Matches}}</h2>
        {{range .Matches}}
        <a href="/goods/edit?id={{.ID}}"><span class="code">{{.InternalCode}}</span>{{.Name}}</a>
        {{end}}
    </div>
    {{end}}
</body>

</html>
