<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Продукция</title>
    <link rel="stylesheet" href="/static/raven-guard.css">
</head>

<body>
    <header class="brandbar">
        <a class="brandbar__brand" href="/"><svg class="brandbar__emblem" viewBox="0 0 64 64" aria-hidden="true"><circle cx="35" cy="25" r="14" fill="#F4F1E9"/><polygon points="6,26 30,17 28,27" fill="#F4F1E9"/><polygon points="13,35 28,27 26,36" fill="#F4F1E9"/><circle cx="34" cy="23" r="3.6" fill="#0A0A0D"/><circle cx="33" cy="22" r="1.1" fill="#C02832"/></svg><span class="brandbar__name">ВОРОН&nbsp;&middot;&nbsp;СКЛАД</span></a>
        <span class="brandbar__motto">Victorus aut Mortis</span>
    </header>
    <h1>Продукция</h1>
    <p><a href="/ms">← Назад в МойСклад</a></p>

    {{if .Error}}
    <div class="error-banner">{{.Error}}</div>
    {{end}}

    <div class="actions">
        <form method="post" action="/goods/search" style="display:flex;gap:8px;margin:0;">
            <input type="text" name="q" value="{{.Query}}" placeholder="Код или название товара" autofocus>
            <button type="submit">Поиск</button>
        </form>
        <a href="/goods/tree"><button class="add-btn">Добавление</button></a>
    </div>

    {{if .Matches}}
    <div class="matches">
        <h2>Найдено: {{len .Matches}}</h2>
        {{range .Matches}}
        <a href="/goods/edit?id={{.ID}}"><span class="code">{{.InternalCode}}</span>{{.Name}}</a>
        {{end}}
    </div>
    {{end}}
</body>

</html>
