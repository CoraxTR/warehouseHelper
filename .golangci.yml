# supported golangci-lint version = 2.6.0
version: "2"
linters:
    default: none
    enable:
        - arangolint
        - asasalint
        - asciicheck
        - bidichk
        - bodyclose
        - canonicalheader
        - containedctx
        - contextcheck
        - copyloopvar
        - cyclop
        - decorder
        - depguard # границы модулей: msclient и refgo не импортируют друг друга
        - dogsled
        #    - dupl # сплошные false positives
        - dupword
        - durationcheck
        - embeddedstructfieldcheck
        #    - err113 # Opinionated.
        - errcheck
        - errchkjson
        - errname
        - errorlint
        - exhaustive
        #    - exhaustruct # Зависит от подхода к разработке.
        - exptostd
        - fatcontext
        - forbidigo
        - forcetypeassert
        #    - funcorder # порядок методов — стиль; исторические файлы не переставляем, новые модули пишем в правильном порядке
        - ginkgolinter
        - gocheckcompilerdirectives
        #    - gochecknoglobals # не позволяет добавлять исключения (time.Date, regex.Must, etc). reassign с настройкой * частично решает проблему https://github.com/tommy-muehle/go-mnd/issues/14
        - gochecknoinits
        - gochecksumtype
        - gocognit
        - goconst
        - gocritic
        - gocyclo
        #    - godoclint # Подходит скорее для библиотек
        - godot
        #    - godox # TODO/FIXME в коде — легитимная дорожная карта (см. cmd/main.go)
        - goheader
        - gomoddirectives
        - gomodguard
        - goprintffuncname
        - gosec
        - gosmopolitan
        - govet
        - grouper
        - iface
        - importas
        - inamedparam
        - ineffassign
        #    - interfacebloat # интерфейсы репозиториев >10 методов — норма для границ БД
        #    - intrange # обычный трехкомпонентный for довольно стандартен, чтобы заставлять менять на for i := range n
        - iotamixing
        #    - ireturn # существуют ситуации, когда нужно возвращать интерфейсы: паттерн фабрика или какие-то внешние либы подразумевают это (ogen, otel)
        #    - lll # редко актуальный при наличии большого экрана и включённом автоформатировании
        - loggercheck
        - maintidx
        - makezero
        - mirror
        #    - mnd # не поддерживает игнор чисел по регулярному выражению. Нельзя исключить строки вида 5*time.Second
        - misspell
        - modernize
        - musttag
        - nakedret
        - nestif
        - nilerr
        - nilnesserr
        - nilnil
        #    - nlreturn # вкусовой: пустая строка перед return
        - noctx
        #    - noinlineerr # запрещает каноничную идиому `if err := f(); err != nil`
        - nolintlint
        #    - nonamedreturns # named returns делают код более явным
        - nosprintfhostport
        #    - paralleltest # t.Parallel() не всегда уместен (общие моки, БД)
        #    - perfsprint # компромисс производительности и чистоты кода. Чаще лучше выбрать чистоту (легкость восприятия)
        - prealloc
        - predeclared
        - promlinter
        - protogetter
        - reassign
        - recvcheck
        - revive
        - rowserrcheck
        - sloglint
        - spancheck
        - sqlclosecheck
        - staticcheck
        #    - tagliatelle # конфликт конвенций: ws-протокол — snake_case, старый API — camelCase
        - tagalign
        - testableexamples
        - testifylint
        #    - testpackage # Зависит от подхода к разработке.
        - thelper
        - tparallel
        - unconvert
        - unparam
        - unqueryvet
        - unused
        - usestdlibvars
        - usetesting
        #    - varnamelen # Иногда сложно найти достойную замену однобуквенным именам. Как вариант _name, но тоже некрасиво.
        - wastedassign
        - whitespace
        #    - wrapcheck # если обертка не через fmt.Errorf, линтер все равно ругается
        #    - wsl_v5 # вкусовой: «добавь пустую строку»; deprecated, заменён wsl_v5
        - zerologlint

    settings:
        depguard:
            rules:
                module-boundary-msclient:
                    files:
                        - "**/internal/msclient/**"
                    deny:
                        - pkg: "warehouseHelper/internal/refgo"
                          desc: "модуль msclient не должен импортировать модуль refgo"
                        - pkg: "warehouseHelper/internal/refgo/**"
                          desc: "модуль msclient не должен импортировать модуль refgo"
                module-boundary-refgo:
                    files:
                        - "**/internal/refgo/**"
                    deny:
                        - pkg: "warehouseHelper/internal/msclient"
                          desc: "модуль refgo не должен импортировать модуль msclient"
                        - pkg: "warehouseHelper/internal/msclient/**"
                          desc: "модуль refgo не должен импортировать модуль msclient"
        cyclop:
            # Default: 10
            max-complexity: 20
        gocritic:
            enable-all: true
            disabled-checks:
                - hugeParam
                - rangeValCopy
                - importShadow
        gocognit:
            # Когнитивная сложность: 30 — низко для кода с бизнес-логикой и длинных тестов.
            min-complexity: 40
        gocyclo:
            # Цикломатическая сложность: синхронизируем с cyclop (20) и revive cyclomatic.
            min-complexity: 40
        nestif:
            min-complexity: 7
        nolintlint:
            allow-unused: false
            require-explanation: true
            require-specific: true
        reassign:
            patterns:
                - .*
        govet:
            enable-all: true
            disable:
                - fieldalignment
                - shadow # Это не всегда ошибка
        prealloc:
            # Report pre-allocation suggestions on for loops.
            # Default: false
            for-loops: true
        revive:
            enable-all-rules: true
            rules:
                - name: unexported-return
                  disabled: true
                - name: line-length-limit
                  disabled: true
                - name: add-constant
                  disabled: true
                - name: unhandled-error
                  disabled: true
                - name: comment-spacings
                  disabled: true
                - name: var-naming
                  disabled: true
                - name: nested-structs
                  disabled: true
                - name: max-public-structs
                  disabled: true
                - name: function-length
                  disabled: true
                - name: import-shadowing
                  disabled: true
                - name: import-alias-naming
                  disabled: true
                - name: empty-block
                  disabled: true
                - name: confusing-naming
                  disabled: true
                - name: exported
                  disabled: true
                - name: unused-receiver
                  disabled: true
                - name: indent-error-flow
                  disabled: true
                - name: early-return
                  disabled: true
                - name: use-any
                  disabled: true
                - name: argument-limit
                  disabled: true
                - name: cognitive-complexity
                  disabled: true
                - name: cyclomatic
                  arguments:
                      - 20
                - name: confusing-naming
                  disabled: true
                - name: deep-exit
                  disabled: true
                - name: get-return
                  disabled: true
                - name: package-directory-mismatch
                  disabled: true
                - name: struct-tag # conflicts with validate user custom flags. Workaround: "validate,option1,option2"
                  disabled: true
        testifylint:
            # Enable all checkers (https://github.com/Antonboom/testifylint#checkers).
            # Default: false
            enable-all: true
        usestdlibvars:
            # Suggest the use of time.Month in time.Date.
            # Default: false
            time-date-month: true
            # Suggest the use of time.Month.String().
            # Default: false
            time-month: true
            # Suggest the use of time.Layout.
            # Default: false
            time-layout: true
            # Suggest the use of crypto.Hash.String().
            # Default: false
            crypto-hash: true
            # Suggest the use of rpc.DefaultXXPath.
            # Default: false
            default-rpc-path: true
            # Suggest the use of sql.LevelXX.String().
            # Default: false
            sql-isolation-level: true
            # Suggest the use of tls.SignatureScheme.String().
            # Default: false
            tls-signature-scheme: true
            # Suggest the use of constant.Kind.String().
            # Default: false
            constant-kind: true
        errcheck:
            # Report about not checking of errors in type assertions: `a := b.(MyStruct)`.
            # Such cases aren't reported by default.
            # Default: false
            check-type-assertions: true
            # report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`.
            # Such cases aren't reported by default.
            # Default: false
            # check-blank: true  # выключено: намеренное игнорирование через `_ =` — легальный паттерн

        staticcheck:
            checks:
                - all
                - -S1008
                - -ST1003  # Poorly chosen identifier. Like camel_case

    exclusions:
        presets:
            - comments
            - common-false-positives

formatters:
    enable:
        - gofmt
        - goimports
        #        - golines # сворачивает даже строки с функциями всего с одним аргументом
        - swaggo
    exclusions:
        generated: lax
        paths:
            - third_party$
            - builtin$
            - examples$

issues:
    max-issues-per-linter: 0
    max-same-issues: 0

run:
    # The mode used to evaluate relative paths.
    # It's used by exclusions, Go plugins, and some linters.
    # The value can be:
    # - `gomod`: the paths will be relative to the directory of the `go.mod` file.
    # - `gitroot`: the paths will be relative to the git root (the parent directory of `.git`).
    # - `cfg`: the paths will be relative to the configuration file.
    # - `wd` (NOT recommended): the paths will be relative to the place where golangci-lint is run.
    # Default: cfg
    relative-path-mode: gomod